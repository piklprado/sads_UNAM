## Clases de abundancia

.pull-left[

* Em muitos inventários ecológicos não é possível medir com precisão a
  abundância de cada espécie, seja pelo contagem de indivíduos ou por
  outra medida, como biomassa.

* Neste casos, as espécies são categorizadas em **classes de abundância**
  
* Um caso muito comum são as classes de cobertura para organismos
sésseis, como plantas ou bentos.]

.pull-right[
&lt;div style="text-align:center; margin-bottom:10px"&gt;
&lt;img src="figs/Braun_Blanquet_scale.png" style="width:90%"&gt;
&lt;p style="font-size:0.7em; margin-top:2px"&gt;Escala de cobertura de  &lt;a href="https://archive.org/details/plantsociologyst00brau/page/32/mode/1up" target="_blank"&gt;Braun-Blanquet (1975)&lt;/a&gt;&lt;/p&gt;
&lt;/div&gt;
]

## Formalizando
&lt;br&gt;
Seja `\(X\)` uma variável aleatória discreta que representa a abundância de uma espécie, com suporte (conjunto de valores possíveis) 

`$$\mathcal{X} = \{1, 2, 3, \ldots, n\}$$`.
--
&lt;br&gt;
Uma classe de abundância `\(C_i\)` é um subconjunto de `\(\mathcal{X}\)`, definido por um intervalo entre um valor mínimo `\(L_i\)` (exclusivo) e um valor máximo `\(U_i\)` (inclusivo):

`$$C_i = \{x \in \mathcal{X} : L_i &lt; x \leq U_i\}$$`


---

## Formalizando

&lt;br&gt;
Um modelo `\(f(x)\)` atribui uma probabilidade a cada valor possível de abundância:

`$$f(x) = P(X = x), \quad x \in \mathcal{X}$$`

--

&lt;br&gt;
Então a probabilidade de uma espécie tomada ao acaso pertencer à classe `\(C_i\)` é a soma das probabilidades atribuídas pelo modelo a todos os valores de abundância contidos nessa classe:

`$$P(X \in C_i) = \sum_{x=L_i+1}^{U_i} f(x)$$`

---

## Distribuições de probabilidades contínuas

.pull-left[

* Para medidas de abundâncias contínuas (como massas, áreas ou
  cobertura), usamos modelos de distribuição contínuas
  (e.g. lognormal, exponencial, gama).

* Para estes modelos, a probabilidade sempre é calculada somando
  valores atribuídos pelo modelo, em um intervalo, por meio de uma
  integral:

$$ P(L \leq x \leq U) ~ = ~ \int_L^U f(x) \, dx $$
]

## Ajuste com el paquete `sads`
.pull-left[
* `sads` tem a função `fitsadC` para ajuste de dados agregados em
  classes de abundância

* Por enquanto, é possível ajustar as distribuições contínuas:
exponencial, gama, lognormal, Weibull e Pareto. 

* Para usar esta função, você precisa de um vetor numérico com o valor
de abundância de cada espécie. Pode ser qualquer valor
contido dentro da classe de abundância da espécie, como o limite superior da
classe ou seu ponto médio. ]

.pull-right[
O conjunto de dados `grasslands` tem o código original da classe de abundância, um label da classe e limite superior e ponto médio da classe de cada espécie numa amostra de plantas nos campos sulinos do Brasil:


``` r
&gt; head(grasslands)
```

```
                      class  cover upper mids
Andropogon lateralis    2.0 15-25%    25 20.0
Andropogon macrothrix   0.1    &lt;1%     1  0.5
Axonopus affinis        0.1    &lt;1%     1  0.5
Baccharis trimera       0.1    &lt;1%     1  0.5
Briza poaemorpha        0.1    &lt;1%     1  0.5
Briza uniolae           0.1    &lt;1%     1  0.5
```
]

## Fitting workflow

As funções de ajuste recebem um objeto da classe `histogram`, que você deve criar com seus dados. As etapas do ajuste são:

--

&lt;br&gt;

--

**1.**  Defina os intervalos das classes de abundância usada: 


``` r
&gt; (grass.brk &lt;- c(0,1,3,5,seq(15,100, by=10),100))
```

```
 [1]   0   1   3   5  15  25  35  45  55  65  75  85  95 100
```
&lt;br&gt;

--

**2.** Crie um objeto histograma estes intervalos e seus dados, com a função `hist()`


``` r
&gt; grass.h &lt;- hist(grasslands$mids, breaks = grass.brk, plot = FALSE)
```

---

## Fitting workflow

O objeto resultante tem os intervalos e os pontos médios das
   classes e o número de observações por classe, entre outras
   informações:


``` r
&gt; str(grass.h)
```

```
List of 6
 $ breaks  : num [1:14] 0 1 3 5 15 25 35 45 55 65 ...
 $ counts  : int [1:13] 16 9 1 1 1 1 0 0 0 0 ...
 $ density : num [1:13] 0.55172 0.15517 0.01724 0.00345 0.00345 ...
 $ mids    : num [1:13] 0.5 2 4 10 20 30 40 50 60 70 ...
 $ xname   : chr "grasslands$mids"
 $ equidist: logi FALSE
 - attr(*, "class")= chr "histogram"
```

---

## Fitting workflow

*3.* Agora passe o objeto de histograma para a função `fitsadC()`, indicando o modelo com o argumento `sad`


``` r
&gt; grass.e &lt;- fitsadC(grass.h, "exp")     
&gt; grass.g &lt;- fitsadC(grass.h, "gamma")   
&gt; grass.l &lt;- fitsadC(grass.h, "lnorm")
```

--

Os objetos da classe `fitsadC` aceitam os mesmos métodos que já vimos 


``` r
&gt; coef(grass.e)
```

```
    rate 
0.358704 
```

``` r
&gt; AIC(grass.g)
```

```
[1] 79.36705
```

## Previstos
.pull-left[
La función `coverpred` calcula el número esperado de espécies por
clase de abundancia

``` r
&gt; grass.e.p &lt;- coverpred(grass.e)
&gt; grass.g.p &lt;- coverpred(grass.g)
&gt; grass.l.p &lt;- coverpred(grass.l)

&gt; plot(grass.h, main = "", xlab = "Clase de abundancia", xlim = c(0, 40))

&gt; points(grass.l.p, col = 3)
